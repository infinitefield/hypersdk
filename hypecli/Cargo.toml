[package]
name = "hypecli"
version = "0.1.8"
edition = "2024"
authors = ["Dario <dario@infinitefieldtrading.com>"]
description = "CLI tool for interacting with Hyperliquid via hypersdk"
repository = "https://github.com/infinitefield/hypersdk"
homepage = "https://github.com/infinitefield/hypersdk"
license = "MPL-2.0"
readme = "README.md"
keywords = ["hyperliquid", "cli", "trading", "dex", "perps"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
documentation = "https://docs.rs/hypersdk"
rust-version = "1.94.1"
include = [
  "src/**",
  "README.md",
  "LICENSE*",
  "Cargo.toml",
  "Cargo.lock"
]

[dependencies]
hypersdk = { path = "..", version = "0.3.1", features = ["morpho"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "signal",
] }
anyhow = "1.0.104"
async-trait = "0.1.92"
tabwriter = "1.4.1"
enum_dispatch = "0.3.13"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "1.0.229", features = ["derive"] }
rmp-serde = "1.3.1"
hex = "0.4.3"
tokio-util = { version = "0.7.20", features = ["codec"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
iroh-tickets = "1.0.0"
iroh-mdns-address-lookup = "0.6.1"
alloy = { version = "2.5.0", default-features = false, features = ["signer-keystore", "signer-ledger", "signer-local"] }
derive_more = { version = "2.1.1", features = ["deref"] }
rpassword = "7.5.5"
indicatif = "0.18.6"
bytes = "1.12.1"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
strsim = "0.11.1"
chrono = "0.4.45"
# For Alloy (0.8 universe)
rand_08 = { package = "rand", version = "0.8.8" }
rand_10 = { package = "rand", version = "0.10.3" }
dotenvy = "0.15.7"
trezor-client = { version = "=0.1.6", default-features = false, features = ["ethereum"] }
bip32 = { version = "0.6.0", default-features = false, features = ["alloc", "secp256k1"] }
tempfile = "3.27.0"
