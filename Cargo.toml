## Package metadata
[package]
name = "hypersdk"
version = "0.3.1"
edition = "2024"
authors = ["Dario <dario@infinitefieldtrading.com>"]
license = "MPL-2.0"
description = "Rust SDK for Hyperliquid"
repository = "https://github.com/infinitefield/hypersdk"
homepage = "https://github.com/infinitefield/hypersdk"
readme = "README.md"
keywords = ["hyperliquid", "sdk", "trading", "dex", "perps"]
documentation = "https://docs.rs/hypersdk"
rust-version = "1.94.1"

include = [
  "abi/**",
  "src/**",
  "README.md",
  "LICENSE*",
  "Cargo.toml",
]
exclude = [
  "/.github/*",
  "/examples/*",
  "/tests/*",
  "/.gitignore",
]

[[example]]
name = "approve-agent"
path = "examples/hypercore/approve_agent.rs"
required-features = ["http"]

[[example]]
